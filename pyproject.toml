[project]
name = "mitre-mapper"
version = "0.1.0"
description = "Map software to MITRE ATT&CK and emit STIX deltas, with a run log built for iterative improvement"
readme = "README.md"
authors = [
    { name = "timothyalder", email = "aldertimothy@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "mitreattack-python>=6.2.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-frontmatter>=1.3.0",
    "rank-bm25>=0.2.2",
    "trafilatura>=2.3.0",
    "typer>=0.27.2",
]

[project.scripts]
mitre-mapper = "mitre_mapper.cli:app"
mitre-mapper-mcp = "mitre_mapper.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model provider (skipped unless -m live)",
    "slow: loads the enterprise bundle (~10-14 s)",
]
addopts = "-m 'not live'"
